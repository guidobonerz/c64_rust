[workspace]
resolver = "2"
members = ["crates/*"]
exclude = ["lib", "examples", "tests/e2e"]

[workspace.package]
version = "0.1.0"
edition = "2024"
publish = false

# The backend runs a data-flow pass over every function: unoptimized it
# takes minutes for a large one.
[profile.dev.package.rustc_codegen_rust64]
opt-level = 2
